services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  agent-service:
    build:
      context: services/agent-service
    environment:
      HTTP_ADDR: :8090
      AGENT_BASE_URL: http://host.docker.internal:11434
      AGENT_MODEL: gemma2:2b
      AGENT_TIMEOUT_SECONDS: 180
    ports:
      - "${AGENT_SERVICE_PORT:-8090}:8090"
    restart: unless-stopped

  backend:
    build:
      context: .
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable
      STORAGE_DIR: /app/storage
      ML_SERVICE_URL: http://ml-service:8000
      ML_TIMEOUT_SECONDS: 15
      AGENT_SERVICE_URL: http://agent-service:8090
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - backend_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      ml-service:
        condition: service_healthy
      agent-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ../frontend
    environment:
      BACKEND_INTERNAL_URL: http://backend:8080
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  ml-service:
    build:
      context: ../ml-service
      dockerfile: ../backend/ml-service.Dockerfile
    environment:
      PYTHONPATH: src:.
    ports:
      - "${ML_SERVICE_PORT:-8000}:8000"
    volumes:
      - backend_storage:/app/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '.venv/bin/python -c "import urllib.request; urllib.request.urlopen(''http://localhost:8000/health'', timeout=2).read()"',
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  backend_storage:
